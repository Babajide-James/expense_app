<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="expense_app" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>expense_app</title>
    <link rel="manifest" href="manifest.json" />
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  </head>
  <body>
    <script>
      let stream = null;
      let videoElement = null;

      function initializeCamera() {
        console.log("JS Camera Initializing...");

        return navigator.mediaDevices
          .getUserMedia({
            video: { facingMode: "user" },
            audio: false,
          })
          .then((mediaStream) => {
            stream = mediaStream;

            videoElement = document.getElementById("flutter-web-camera-video");
            if (!videoElement) {
              videoElement = document.createElement("video");
              videoElement.id = "flutter-web-camera-video";
              videoElement.autoplay = true;
              videoElement.muted = true;
              videoElement.playsInline = true;
              videoElement.style.position = "fixed";
              videoElement.style.top = "0";
              videoElement.style.left = "0";
              videoElement.style.width = "100%";
              videoElement.style.height = "100%";
              videoElement.style.objectFit = "cover";
              videoElement.style.zIndex = "-1";
              document.body.appendChild(videoElement);
            }

            videoElement.srcObject = stream;
            // Load face-api models and start detection
            loadFaceApiModels().then(() => {
              startFaceDetection();
            });
            if (window.onCameraStateChanged) {
              window.onCameraStateChanged(true);
            }
            return true;
          })
          .catch((error) => {
            console.error("initializeCamera error", error);
            if (window.onCameraError) {
              window.onCameraError(error?.message || String(error));
            }
            return false;
          });
      }

      function stopCamera() {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
        if (videoElement) {
          videoElement.remove();
          videoElement = null;
        }
        if (window.onCameraStateChanged) {
          window.onCameraStateChanged(false);
        }
      }

      function takePhoto() {
        if (!videoElement) {
          return;
        }
        const canvas = document.createElement("canvas");
        canvas.width = videoElement.videoWidth;
        canvas.height = videoElement.videoHeight;
        const context = canvas.getContext("2d");
        if (!context) {
          return;
        }
        context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg");
        if (window.onPhotoTaken) {
          window.onPhotoTaken(dataUrl, dataUrl);
        }
      }

      async function loadFaceApiModels() {
        try {
          await faceapi.nets.tinyFaceDetector.loadFromUri(
            "https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights/",
          );
          console.log("Face detection models loaded");
        } catch (error) {
          console.error("Failed to load face detection models", error);
        }
      }

      function startFaceDetection() {
        if (!videoElement) return;

        const detectFaces = async () => {
          if (!videoElement || videoElement.paused || videoElement.ended)
            return;

          try {
            const detections = await faceapi.detectAllFaces(
              videoElement,
              new faceapi.TinyFaceDetectorOptions(),
            );
            const detected = detections.length > 0;
            if (window.onFaceDetectionStatus) {
              window.onFaceDetectionStatus(
                JSON.stringify({
                  detected: detected,
                  expressions: detections.map((d) => ({ score: d.score || 0 })),
                }),
              );
            }
          } catch (error) {
            console.error("Face detection error", error);
          }

          // Continue detection every 500ms
          setTimeout(detectFaces, 500);
        };

        detectFaces();
      }
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
