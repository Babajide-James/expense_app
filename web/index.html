<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="expense_app" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>expense_app</title>
    <link rel="manifest" href="manifest.json" />
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  </head>
  <body>
    <script>
      let stream = null;
      let videoElement = null;
      let overlayCanvas = null;
      let overlayCtx = null;

      // Expose a helper to query the camera permission state (where supported).
      async function queryCameraPermission() {
        try {
          if (navigator.permissions && navigator.permissions.query) {
            const status = await navigator.permissions.query({
              name: "camera",
            });
            return status.state; // 'granted' | 'denied' | 'prompt'
          }
        } catch (e) {
          // Some browsers don't allow querying camera permission; fall through
        }
        return "unknown";
      }
      // Attach to window for Dart to call via JS interop
      window.queryCameraPermission = queryCameraPermission;

      function initializeCamera() {
        console.log("JS Camera Initializing...");

        return navigator.mediaDevices
          .getUserMedia({
            video: { facingMode: "user" },
            audio: false,
          })
          .then((mediaStream) => {
            stream = mediaStream;

            // Prefer a video element provided by Flutter (exposed as window.flutterWebCameraVideo),
            // otherwise find an existing element in the DOM.
            videoElement =
              window.flutterWebCameraVideo ||
              document.getElementById("flutter-web-camera-video");
            if (!videoElement) {
              videoElement = document.createElement("video");
              videoElement.id = "flutter-web-camera-video";
              videoElement.autoplay = true;
              videoElement.muted = true;
              videoElement.playsInline = true;
              // keep styling minimal; Flutter will position the element when rendered via HtmlElementView
              videoElement.style.position = "fixed";
              videoElement.style.top = "0";
              videoElement.style.left = "0";
              videoElement.style.width = "100%";
              videoElement.style.height = "100%";
              videoElement.style.objectFit = "cover";
              videoElement.style.zIndex = "-1";
              // Only append to body when not using Flutter-provided element
              document.body.appendChild(videoElement);
            }

            videoElement.srcObject = stream;
            videoElement
              .play()
              .then(() => {
                console.log("Video playing, loading models...");
                loadFaceApiModels().then(() => {
                  console.log("Models loaded, starting detection...");
                  startFaceDetection();
                });
              })
              .catch((playError) => {
                console.error("Video play failed", playError);
              });
            if (window.onCameraStateChanged) {
              window.onCameraStateChanged(true);
            }
            return true;
          })
          .catch((error) => {
            console.error("initializeCamera error", error);
            if (window.onCameraError) {
              window.onCameraError(error?.message || String(error));
            }
            return false;
          });
      }

      function stopCamera() {
        try {
          if (videoElement) {
            try {
              videoElement.pause();
            } catch (e) {}
            try {
              videoElement.srcObject = null;
            } catch (e) {}
            try {
              videoElement.remove();
            } catch (e) {}
            videoElement = null;
          }

          if (stream) {
            try {
              stream.getTracks().forEach((track) => {
                try {
                  track.stop();
                } catch (e) {}
              });
            } catch (e) {}
            stream = null;
          }

          if (window.onCameraStateChanged) {
            window.onCameraStateChanged(false);
          }
        } catch (err) {
          console.error("stopCamera error", err);
        }
      }

      function takePhoto() {
        if (!videoElement) {
          return;
        }
        const canvas = document.createElement("canvas");
        canvas.width = videoElement.videoWidth;
        canvas.height = videoElement.videoHeight;
        const context = canvas.getContext("2d");
        if (!context) {
          return;
        }
        context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg");
        if (window.onPhotoTaken) {
          window.onPhotoTaken(dataUrl, dataUrl);
        }
      }

      async function loadFaceApiModels() {
        try {
          if (typeof faceapi === "undefined") {
            console.error("faceapi library not available");
            if (window.onCameraError)
              window.onCameraError("Face detection library not loaded");
            return;
          }

          // Try local /models/ first (recommended for offline/fast startup)
          const localBase = "/models/";
          try {
            const head = await fetch(
              localBase + "tiny_face_detector_model-weights_manifest.json",
              { method: "HEAD" },
            );
            if (head.ok) {
              await faceapi.nets.tinyFaceDetector.loadFromUri(localBase);
              try {
                await faceapi.nets.faceExpressionNet.loadFromUri(localBase);
              } catch (_) {}
              console.log("Face detection models loaded from local /models/");
              return;
            }
          } catch (_) {
            // local models not available, fall back to CDN
          }

          // Try known remote hosts (in order): jsDelivr GitHub, raw GitHub
          const fallbackBases = [
            "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights/",
            "https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights/",
          ];

          let loaded = false;
          for (const base of fallbackBases) {
            try {
              console.log("Attempting to load models from", base);
              await faceapi.nets.tinyFaceDetector.loadFromUri(base);
              try {
                await faceapi.nets.faceExpressionNet.loadFromUri(base);
              } catch (e) {
                console.warn("Expression model not available at", base);
              }
              console.log("Face detection models loaded from", base);
              loaded = true;
              break;
            } catch (err) {
              console.warn("Failed to load models from", base, err);
            }
          }

          if (!loaded) {
            throw new Error(
              "Failed to load face detection models from known hosts",
            );
          }
        } catch (error) {
          console.error("Failed to load face detection models", error);
          if (window.onCameraError)
            window.onCameraError(
              "Failed to load face detection models: " +
                (error?.message || error),
            );
        }
      }

      function startFaceDetection() {
        if (!videoElement) return;
        // Create an overlay canvas (once) aligned with the video for debug drawing
        try {
          if (typeof faceapi !== "undefined" && !overlayCanvas) {
            try {
              overlayCanvas = faceapi.createCanvasFromMedia(videoElement);
            } catch (_) {
              overlayCanvas = document.createElement("canvas");
            }
            overlayCanvas.style.position = "absolute";
            overlayCanvas.style.top = videoElement.offsetTop + "px";
            overlayCanvas.style.left = videoElement.offsetLeft + "px";
            overlayCanvas.style.zIndex = "9999";
            overlayCanvas.style.pointerEvents = "none";
            // Append next to the video so it sits on top when rendered
            try {
              videoElement.parentNode.appendChild(overlayCanvas);
            } catch (_) {
              document.body.appendChild(overlayCanvas);
            }
            try {
              overlayCtx = overlayCanvas.getContext("2d");
            } catch (_) {
              overlayCtx = null;
            }
          }
        } catch (e) {
          console.warn("Overlay canvas setup failed", e);
        }

        const detectFaces = async () => {
          if (!videoElement || videoElement.paused || videoElement.ended) {
            console.log("Video not ready for detection");
            // try again shortly in case video becomes ready
            setTimeout(detectFaces, 300);
            return;
          }

          try {
            console.log("Running face detection...");
            // Tune detector for better recall on small/near faces
            const options = new faceapi.TinyFaceDetectorOptions({
              inputSize: 320,
              scoreThreshold: 0.35,
            });

            const detections = await faceapi
              .detectAllFaces(videoElement, options)
              .withFaceExpressions();

            const detected = detections.length > 0;
            console.log("Detections:", detections.length, detected);

            // Draw debug overlays if possible
            try {
              const displaySize = {
                width: videoElement.videoWidth || videoElement.clientWidth,
                height: videoElement.videoHeight || videoElement.clientHeight,
              };
              if (overlayCanvas && typeof faceapi !== "undefined") {
                // make sure canvas matches video display size
                faceapi.matchDimensions(overlayCanvas, displaySize);
                const resized = faceapi.resizeResults(detections, displaySize);
                const ctx = overlayCanvas.getContext("2d");
                ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                faceapi.draw.drawDetections(overlayCanvas, resized);
                try {
                  faceapi.draw.drawFaceExpressions(overlayCanvas, resized);
                } catch (_) {}
              }
            } catch (e) {
              console.warn("Overlay draw failed", e);
            }

            // Prepare payloads for Dart
            const expressionsPayload = detections.map(
              (d) => d.expressions || {},
            );
            const boxesPayload = detections.map((d) => {
              try {
                const b = d.detection.box;
                return { x: b.x, y: b.y, width: b.width, height: b.height };
              } catch (_) {
                return null;
              }
            });

            if (window.onFaceDetectionStatus) {
              window.onFaceDetectionStatus(
                JSON.stringify({
                  detected: detected,
                  expressions: expressionsPayload,
                  boxes: boxesPayload,
                }),
              );
            }
          } catch (error) {
            console.error("Face detection error", error);
          }

          // Continue detection every 300ms
          setTimeout(detectFaces, 300);
        };

        detectFaces();
      }

      // Ensure camera stops when user navigates away or page is hidden
      window.addEventListener("beforeunload", () => {
        try {
          stopCamera();
        } catch (e) {}
      });
      window.addEventListener("pagehide", () => {
        try {
          stopCamera();
        } catch (e) {}
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          try {
            stopCamera();
          } catch (e) {}
        }
      });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
