name: expense_app
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  camera: ^0.11.2
  facial_liveness_verification: ^2.1.0
  permission_handler: ^12.0.1
  local_auth: ^3.0.1
  face_detection_tflite: ^6.2.4
  faceapidetectionweb: ^1.0.0+7
  flutter_tflite_web: ^3.0.0
  camera_windows: ^0.2.6+4
  camera_web: ^0.3.5+3
  # face_detection_tflite: 4.5.0 # Or an earlier version

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

dependency_overrides:
  meta: ^1.17.0

